services:
  - type: web
    name: duet-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_ORIGIN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ENABLE_SPOTIFY
        value: "true"

# NOTE: there is intentionally no frontend service here. The frontend is
# deployed on Netlify (https://duet-music.netlify.app/); a Render static
# service here would create a duplicate, unused copy of the site.
